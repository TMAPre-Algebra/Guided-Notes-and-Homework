<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Using the Metric System</title>
<style>
 :root{ --ink:#1d2330; --paper:#fdfdf7; --rule:#cfd2dc; --accent:#2557a7; --accent-soft:#e7eef9;
   --shade:#6f7785; --good:#1e7a3b; --good-bg:#e6f5ec; --warn:#a02828; --warn-bg:#fbe9e9; --box:#ffffff; --fs:1; }
 :root.hc{ --ink:#000; --paper:#fff; --rule:#000; --accent:#000; --accent-soft:#ffe600; --shade:#000;
   --good:#004b1e; --good-bg:#c9ffd8; --warn:#7a0000; --warn-bg:#ffd6d6; --box:#fff; }
 *{box-sizing:border-box}
 html,body{margin:0}
 body{background:#eef0ee;color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5;
   -webkit-text-size-adjust:100%;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
 header.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:2px solid var(--accent);
   padding:10px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
 header.topbar h1{margin:0;font-size:calc(18px * var(--fs));color:var(--accent);font-family:"Helvetica Neue",Arial,sans-serif}
 .who{display:flex;flex-wrap:wrap;gap:8px 12px;flex:1;justify-content:flex-end;align-items:center}
 .who label{font-size:calc(13px * var(--fs));color:var(--shade)}
 .who input{font-family:inherit;font-size:calc(14px * var(--fs));padding:6px 8px;border:1px solid var(--rule);border-radius:6px}
 .tools{display:flex;gap:6px;flex-wrap:wrap}
 button{font-family:"Helvetica Neue",Arial,sans-serif;cursor:pointer;border:1px solid var(--accent);border-radius:6px;
   padding:7px 12px;font-size:calc(13px * var(--fs));font-weight:700;color:#fff;background:var(--accent)}
 button.ghost{background:#fff;color:var(--accent)}
 button:active{transform:translateY(1px)}
 main{max-width:820px;margin:16px auto;background:var(--paper);border:1px solid var(--rule);border-radius:10px;
   box-shadow:0 6px 24px rgba(0,0,0,.08);padding:26px 30px}
 .doc-h{border-bottom:2px solid var(--accent);padding-bottom:10px;margin-bottom:14px}
 .doc-h h2{margin:0 0 2px;font-size:calc(24px * var(--fs));font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
 .doc-h .sub{color:var(--shade);font-size:calc(14px * var(--fs))}
 .doc-h .due{float:right;color:var(--accent);font-weight:700;font-size:calc(14px * var(--fs))}
 .intro{background:var(--accent-soft);border-radius:8px;padding:12px 14px;margin:12px 0 18px;font-size:calc(15px * var(--fs))}
 .namerow{display:none;margin:0 0 10px;font-size:calc(15px * var(--fs))}
 section.part{margin:18px 0}
 section.part>h3{font-family:"Helvetica Neue",Arial,sans-serif;font-size:calc(16px * var(--fs));color:var(--accent);
   border-bottom:1px solid var(--rule);padding-bottom:4px;margin:0 0 4px}
 .note{color:var(--shade);font-style:italic;font-size:calc(14px * var(--fs));margin:4px 0 10px}
 .p{border:1px solid var(--rule);border-radius:8px;background:var(--box);padding:12px 14px;margin:10px 0;break-inside:avoid}
 .p .q{font-size:calc(16px * var(--fs));font-weight:700;margin-bottom:8px}
 .p .q .num{color:var(--accent);margin-right:6px}
 .ansline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
 .ansline label{font-size:calc(14px * var(--fs));color:var(--shade);font-weight:700}
 .ansline input[type=text]{font-family:inherit;font-size:calc(16px * var(--fs));padding:6px 8px;border:0;border-bottom:2px solid var(--accent);
   background:transparent;min-width:170px;color:var(--ink)}
 .choices{display:flex;flex-wrap:wrap;gap:8px 18px;margin:4px 0}
 .choices label{font-size:calc(15px * var(--fs));display:flex;align-items:center;gap:6px;cursor:pointer}
 .choices input{width:18px;height:18px}
 .worklabel{font-size:calc(13px * var(--fs));color:var(--shade);margin:8px 0 2px}
 textarea.work{width:100%;min-height:60px;font-family:inherit;font-size:calc(15px * var(--fs));padding:8px;
   border:1px dashed var(--rule);border-radius:6px;background:#fff;resize:vertical;color:var(--ink)}
 .pbtns{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
 .pbtns button{padding:5px 10px;font-size:calc(12px * var(--fs))}
 .result{font-size:calc(14px * var(--fs));font-weight:700;padding:3px 8px;border-radius:5px}
 .result.ok{color:var(--good);background:var(--good-bg)}
 .result.no{color:var(--warn);background:var(--warn-bg)}
 .reveal{font-size:calc(14px * var(--fs));color:var(--ink);background:var(--accent-soft);border-radius:6px;padding:6px 10px;margin-top:6px;display:none}
 .reveal.show{display:block}
 .foot{color:var(--shade);font-size:calc(13px * var(--fs));border-top:1px solid var(--rule);margin-top:18px;padding-top:10px}
 [hidden]{display:none!important}
 @media print{
   @page{ margin:12mm 13mm 14mm; }
   body{background:#fff}
   header.topbar{display:none}
   [data-screen]{display:none!important}
   main{box-shadow:none;border:0;border-radius:0;margin:0;max-width:100%;padding:0}
   .namerow{display:block;border-bottom:1px solid #000;padding-bottom:6px;margin-bottom:8px}
   .pbtns,.reveal,.result{display:none!important}
   .intro{background:#f2f2f2;margin:8px 0 12px;padding:8px 10px}
   section.part{margin:10px 0}
   .note{margin:2px 0 6px}
   .p{break-inside:avoid;border-color:#999;padding:7px 10px;margin:7px 0}
   .p .q{margin-bottom:4px}
   .worklabel{margin:5px 0 1px}
   .ansline input[type=text]{min-width:220px}
   textarea.work{min-height:50px;border:1px solid #999;background:#fff}
 }
</style>
<style id="twopage">@media print{@page{margin:8mm 10mm 8mm;}header.topbar,.topbar{display:none!important}.intro{margin:2px 0 5px!important;padding:4px 8px!important;font-size:11.5px!important}.namerow{margin:0 0 4px!important;padding-bottom:3px!important}section.part{margin:3px 0!important}section.part>h3{margin:0 0 2px!important;font-size:12.5px!important;padding-bottom:2px!important}.note{margin:1px 0 3px!important;font-size:10.5px!important}.p{padding:3px 8px!important;margin:3px 0!important}.p .q{font-size:12px!important;margin-bottom:2px!important}.ansline{margin:3px 0!important}.ansline input[type=text]{min-width:140px!important}.choices{margin:2px 0!important}.worklabel{margin:1px 0 0!important;font-size:9.5px!important}textarea.work{min-height:16px!important}.foot{display:none!important}}</style></head>
<body>
<header class="topbar">
  <h1 id="hwtitle"></h1>
  <div class="who">
    <span class="tools">
      <button class="ghost" id="aMinus" title="Smaller text">A−</button>
      <button class="ghost" id="aPlus" title="Bigger text">A+</button>
      <button class="ghost" id="hc" title="High contrast">◐ Contrast</button>
      <button class="ghost" id="reset" title="Clear my answers">Reset</button>
      <button id="printBtn">📄 Save as PDF</button>
    </span>
  </div>
</header>
<main>
  <div class="doc-h">
    <span class="due" id="due"></span>
    <h2 id="h2title"></h2>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="namerow">Name: ____________________________&nbsp;&nbsp;&nbsp;&nbsp;Date: ______________</div>
  <div class="who" style="justify-content:flex-start;margin:-4px 0 8px" data-screen>
    <label for="stuName">Your name</label>
    <input type="text" id="stuName" placeholder="Type your name" autocomplete="name">
  </div>
  <div class="intro" id="intro"></div>
  <div id="body"></div>
  <div class="foot">Answer every question and show your work in each box. Your typing saves automatically on this device; use Save as PDF when you're finished.</div>
</main>
<script>
const HW = {"id": "hw_3_7_metric_system", "code": "5.MD.A.1", "title": "Using the Metric System", "subtitle": "Pre-Algebra · Measurement · Wednesday night", "due": "Thursday", "intro": "Change each measurement. To a smaller unit, multiply. To a larger unit, divide. Show your work.", "sections": [{"name": "Change the units", "problems": [{"n": 1, "q": "3 m = ____ cm", "type": "short", "m": "e", "work": true}, {"n": 2, "q": "5 km = ____ m", "type": "short", "m": "e", "work": true}, {"n": 3, "q": "2000 mL = ____ L", "type": "short", "m": "e", "work": true}, {"n": 4, "q": "4 kg = ____ g", "type": "short", "m": "e", "work": true}]}, {"name": "More practice", "problems": [{"n": 5, "q": "250 cm = ____ m", "type": "short", "m": "e", "work": true}, {"n": 6, "q": "1.5 L = ____ mL", "type": "short", "m": "e", "work": true}]}, {"name": "Think", "problems": [{"n": 7, "q": "Which one is longest?", "type": "mc", "choices": ["1 km", "1 m", "1 cm"], "work": true}, {"n": 8, "q": "Evan said 3 m = 30 cm. What did he do wrong? What is the correct answer?", "type": "explain", "work": true}]}, {"name": "Challenge (optional)", "problems": [{"n": 9, "q": "Luca's fish tank holds 20 L. How many mL is that?", "type": "short", "m": "e", "work": true}]}], "answers_extra": {}};
(function(){
 "use strict";
 var KEY = "hwsave_"+HW.id;
 function $(id){return document.getElementById(id);}
 function esc(s){return String(s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);});}
 function norm(s){return (s||"").toString().toLowerCase().replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/^=/,'');}

 // header text
 $('hwtitle').textContent = HW.title;
 $('h2title').textContent = HW.title;
 $('subtitle').textContent = HW.subtitle + "  ·  " + HW.code;
 $('due').textContent = "Due " + HW.due;
 $('intro').textContent = HW.intro;
 document.title = HW.title;

 // build body
 var body = $('body');
 HW.sections.forEach(function(sec){
   var s = document.createElement('section'); s.className='part';
   var h = document.createElement('h3'); h.textContent = sec.name; s.appendChild(h);
   if(sec.note){ var nt=document.createElement('div'); nt.className='note'; nt.textContent=sec.note; s.appendChild(nt); }
   sec.problems.forEach(function(p){
     var d = document.createElement('div'); d.className='p'; d.id='p'+p.n;
     var q = document.createElement('div'); q.className='q';
     q.innerHTML='<span class="num">'+p.n+'.</span>'+esc(p.q); d.appendChild(q);
     if(p.type==='mc'){
       var ch=document.createElement('div'); ch.className='choices';
       p.choices.forEach(function(c){
         var lab=document.createElement('label');
         var r=document.createElement('input'); r.type='radio'; r.name='q'+p.n; r.value=c; r.dataset.k='ans'+p.n;
         lab.appendChild(r); lab.appendChild(document.createTextNode(' '+c)); ch.appendChild(lab);
       });
       d.appendChild(ch);
     } else if(p.type==='short'){
       var al=document.createElement('div'); al.className='ansline';
       var lb=document.createElement('label'); lb.textContent='Answer:'; lb.setAttribute('for','ans'+p.n);
       var inp=document.createElement('input'); inp.type='text'; inp.id='ans'+p.n; inp.dataset.k='ans'+p.n; inp.autocomplete='off';
       al.appendChild(lb); al.appendChild(inp); d.appendChild(al);
     }
     if(p.work!==false){
       var wl=document.createElement('div'); wl.className='worklabel'; wl.textContent='Show your work';
       var ta=document.createElement('textarea'); ta.className='work'; ta.dataset.k='work'+p.n; ta.rows=2;
       d.appendChild(wl); d.appendChild(ta);
     }
     s.appendChild(d);
   });
   body.appendChild(s);
 });

 function getVal(p,d){
   if(p.type==='mc'){ var r=d.querySelector('input[name="q'+p.n+'"]:checked'); return r?r.value:''; }
   if(p.type==='short'){ var i=d.querySelector('#ans'+p.n); return i?i.value:''; }
   return '';
 }
 function checkOne(p,d){
   var res=d.querySelector('.result'); res.style.display='inline-block';
   var v=getVal(p,d);
   if(!v){ res.className='result no'; res.textContent='Type or pick an answer first'; return false; }
   var ok=false, nv=norm(v);
   if(p.m==='c'){ ok = p.accept.some(function(a){ return nv.indexOf(norm(a))>=0; }); }
   else { ok = p.accept.some(function(a){ return norm(a)===nv; }); }
   res.className='result '+(ok?'ok':'no'); res.textContent = ok?'✓ Correct':'✗ Try again';
   return ok;
 }

 // ---- autosave ----
 function save(){
   try{ var o={_name: ($('stuName').value||'')};
     document.querySelectorAll('[data-k]').forEach(function(el){
       if(el.type==='radio'){ if(el.checked) o[el.dataset.k]=el.value; }
       else o[el.dataset.k]=el.value;
     });
     localStorage.setItem(KEY, JSON.stringify(o));
   }catch(e){}
 }
 function load(){
   try{ var raw=localStorage.getItem(KEY); if(!raw)return; var o=JSON.parse(raw);
     if(o._name) $('stuName').value=o._name;
     document.querySelectorAll('[data-k]').forEach(function(el){
       var v=o[el.dataset.k]; if(v===undefined)return;
       if(el.type==='radio'){ if(el.value===v) el.checked=true; }
       else el.value=v;
     });
   }catch(e){}
 }
 document.addEventListener('input',save,true);
 document.addEventListener('change',save,true);
 load();

 // ---- toolbar ----
 var fs=1; function applyFs(){document.documentElement.style.setProperty('--fs',fs.toFixed(2)); try{localStorage.setItem('hw_fs',fs);}catch(e){}}
 try{ var sfs=parseFloat(localStorage.getItem('hw_fs')); if(sfs){fs=sfs;applyFs();} }catch(e){}
 try{ if(localStorage.getItem('hw_hc')==='1') document.documentElement.classList.add('hc'); }catch(e){}
 $('aPlus').onclick=function(){fs=Math.min(1.6,fs+0.1);applyFs();};
 $('aMinus').onclick=function(){fs=Math.max(0.85,fs-0.1);applyFs();};
 $('hc').onclick=function(){var on=document.documentElement.classList.toggle('hc'); try{localStorage.setItem('hw_hc',on?'1':'0');}catch(e){}};
 $('printBtn').onclick=function(){ try{var nm=(($('stuName')&&$('stuName').value)||'').trim(); document.title = nm ? (nm+' - '+HW.title) : HW.title;}catch(e){} window.print(); };
 $('reset').onclick=function(){ if(confirm('Clear all your answers on this device?')){ try{localStorage.removeItem(KEY);}catch(e){} location.reload(); } };
})();
</script>
</body>
</html>
